name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataguard
          POSTGRES_PASSWORD: dataguard
          POSTGRES_DB: dataguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Apply schema
        run: |
          sudo apt-get install -y postgresql-client
          for f in sql/init/*.sql; do PGPASSWORD=dataguard psql -h localhost -U dataguard -d dataguard -f "$f"; done
      - run: ruff check .
      - run: pytest --cov=dataguard
